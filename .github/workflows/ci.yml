name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brainharbor
          POSTGRES_USER: brainharbor
          POSTGRES_PASSWORD: brainharbor_dev
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U brainharbor -d brainharbor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # WI-102: the a11y smoke tests drive headless Chromium via Playwright.
      - name: Install Playwright browsers
        run: pwsh tests/BrainHarbor.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test --no-build --configuration Release
