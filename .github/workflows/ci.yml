name: CI

# Branch model (2026-08-11): feature branches PR into `develop`; a
# develop → main PR is a RELEASE — merging it deploys to Azure.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brainharbor
          POSTGRES_USER: brainharbor
          POSTGRES_PASSWORD: brainharbor_dev
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U brainharbor -d brainharbor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # WI-102: the a11y smoke tests drive headless Chromium via Playwright.
      - name: Install Playwright browsers
        run: pwsh tests/BrainHarbor.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # Category=Live drives the real Claude CLI (WI-415's reading-level
      # measurement). It is not installed on the runner, and it costs
      # subscription usage — an opt-in local tool, never CI.
      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=Live"

      # WI-106: the readability promise is machine-enforced — every curated
      # page and glossary term must pass the Flesch-Kincaid gate.
      - name: ContentCheck
        run: dotnet run --project tools/BrainHarbor.ContentCheck --configuration Release --no-build

  # WI-401: merging to main deploys to production. Migrations run on app
  # start (Database:MigrateOnStartup, advisory-locked), so the deploy needs no
  # database access — the only secret here is the publish profile.
  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/BrainHarbor.Web --configuration Release --output publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-brainharbor-prod-eus2
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: publish

      # Migrations run on app START, not in this workflow — so a bad migration
      # would otherwise show as a green deploy and a dead site. This step makes
      # the run honest: the site must actually answer before we call it done.
      #
      # WI-431. The previous version of this check asked "did something respond"
      # when the question is "is the site healthy". It hit ONLY "/", on the
      # azurewebsites hostname, and exited on the FIRST 200 — which during App
      # Service's old/new overlap can come from the instance being replaced. On
      # 2026-08-15, eight deploys each served 500s on /research, /get-help-now,
      # /trials and /search for about a minute while "/" answered 200 throughout,
      # and this step went green every time.
      #
      # Three changes: every main route, the domain visitors actually use, and
      # two CONSECUTIVE clean passes so one lucky hit cannot pass it. The polling
      # also warms those routes, which shortens the window a real visitor can
      # fall into. It does not remove that window — only a staging slot and a
      # swap would, and slots need Standard tier.
      #
      # On failure it prints the response body, because eight sightings of this
      # produced no evidence of the CAUSE. The next occurrence should.
      - name: Smoke check
        run: |
          SITE="https://brainharbor.org"
          FALLBACK="https://app-brainharbor-prod-eus2.azurewebsites.net"
          ROUTES="/ /research /trials /search /get-help-now"
          NEEDED=2
          clean=0

          for attempt in $(seq 1 20); do
            bad=""
            for route in $ROUTES; do
              code=$(curl -s -o /tmp/smoke-body -w "%{http_code}" --max-time 20 "$SITE$route" || echo "000")
              if [ "$code" != "200" ]; then
                bad="$bad $route($code)"
                echo "--- $route returned $code, first 300 bytes of the body: ---"
                head -c 300 /tmp/smoke-body || true
                echo ""
              fi
            done

            if [ -z "$bad" ]; then
              clean=$((clean + 1))
              echo "attempt $attempt: every route 200 ($clean of $NEEDED consecutive)"
              if [ "$clean" -ge "$NEEDED" ]; then
                echo "site healthy after deploy"
                exit 0
              fi
            else
              clean=0
              echo "attempt $attempt: still settling -$bad"
            fi

            sleep 10
          done

          echo "FAILED: the site did not serve every route cleanly after deploy"
          echo "--- same routes on the Azure hostname, to tell app from domain: ---"
          for route in $ROUTES; do
            echo "$route -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$FALLBACK$route" || echo 000)"
          done
          exit 1
